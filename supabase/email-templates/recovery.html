<h2 style="font-family:sans-serif">Reset your CareerHub password</h2>
<p style="font-family:sans-serif">We got a request to reset the password for this account. This link expires in an hour.</p>
<p style="font-family:sans-serif">
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
     style="display:inline-block;padding:10px 18px;background:#171717;color:#ffffff;text-decoration:none;border-radius:8px">
    Choose a new password
  </a>
</p>
<p style="font-family:sans-serif;color:#555;font-size:13px">
  If you didn't ask for this, you can ignore this email. Your password won't change.
</p>
