<h2 style="font-family:sans-serif">Confirm your CareerHub account</h2>
<p style="font-family:sans-serif">Thanks for signing up. Confirm your email address to start tracking your applications.</p>
<p style="font-family:sans-serif">
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/dashboard"
     style="display:inline-block;padding:10px 18px;background:#171717;color:#ffffff;text-decoration:none;border-radius:8px">
    Confirm my email
  </a>
</p>
<p style="font-family:sans-serif;color:#555;font-size:13px">
  The link works once. If you didn't create a CareerHub account, you can ignore this email.
</p>
